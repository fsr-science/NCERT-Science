name: Generate files manifest

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fmtree:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate files.json
        run: python3 fmtree.py

      - name: Commit manifest when changed
        run: |
          if git diff --quiet -- files.json; then
            echo "files.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files.json
          git commit -m "chore: regenerate files manifest [skip ci]"
          git push