<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCERT Science</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>NCERT Science</h1>
      </div>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search files and folders..." />
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">Browse</div>
        <nav id="tree"></nav>
      </aside>

      <section class="content">
        <div class="viewer-toolbar">
          <a id="openFileLink" href="#" target="_blank" rel="noopener">Open file</a>
        </div>

        <div id="viewerBox" class="viewer-box">
          <div id="emptyState" class="empty-state">
            Select a file or folder to browse.
          </div>
          <iframe id="pdfFrame" title="PDF Viewer"></iframe>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
